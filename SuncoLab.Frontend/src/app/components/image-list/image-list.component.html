<div class="spc-top spc-bottom image-scroll-container">
  <div *ngFor="let image of images" class="spc-bottom center image-item">
    <div>
      <a href="javascript:void(0);" (click)="openImage(image.file.path)">
        <img [src]="image.file.path" alt="Cinque Terre" width="{{width}}" height="{{height}}" class="fit-image">
      </a>

      <div *ngIf="edit || mosaicEdit" class="image-actions">
        <div *ngIf="edit">
          <mat-icon (click)="deleteFile(image.file.id)" class="delete-icon">delete_forever</mat-icon>
          <button class="option-button-active" (click)="setCoverImage(image.albumId, image.id)">
            Set As Cover Image
          </button>
        </div>
        <div *ngIf="mosaicEdit">
          <button class="option-button-active" (click)="onImageForMosaicSelected(image)">
            Select for Mosaic
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
