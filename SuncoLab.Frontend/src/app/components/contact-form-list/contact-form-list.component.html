<table mat-table [dataSource]="data">

    <ng-container matColumnDef="dateCreated">
        <th mat-header-cell *matHeaderCellDef>Date Submitted</th>
        <td mat-cell *matCellDef="let row">{{ row.dateCreated | date:'dd-MM-yyyy HH:mm' }}</td>
    </ng-container>

  <ng-container matColumnDef="firstName">
    <th mat-header-cell *matHeaderCellDef>First Name</th>
    <td mat-cell *matCellDef="let row">{{ row.firstName }}</td>
  </ng-container>

  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef>Last Name</th>
    <td mat-cell *matCellDef="let row">{{ row.lastName }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let row">{{ row.email }}</td>
  </ng-container>

  <ng-container matColumnDef="resolved">
    <th mat-header-cell *matHeaderCellDef>Resolved</th>
    <td mat-cell *matCellDef="let row">
        <div class="resolved-cell">
            <mat-icon *ngIf="row.resolved">check</mat-icon>
            <mat-icon *ngIf="!row.resolved">close</mat-icon>
            <button mat-button color="primary" *ngIf="!row.resolved">Mark as Resolved</button>
        </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<mat-paginator 
  [length]="total"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [pageSizeOptions]="pageSizeOptions"
  (page)="onPageChange($event)">
</mat-paginator>
