<!--
  Albumi kao polaroidi zalijepljeni vrpcom na papir: svaki malo drugačije zakrenut, na hover se izravnaju i podignu.
  Klik otvara album u popupu (CarouselComponent). U adminu (edit) bez zakretanja, s kontrolama ispod.
-->
<ul class="albums" [class.albums--edit]="edit">
    @for (album of albums; track album.id; let i = $index) {
        <li class="album" [style.--r]="rotations[i % rotations.length]">
            <button type="button" class="polaroid" (click)="openImageModal(album.id, album.name)" [attr.aria-label]="'Otvori album ' + album.name">
                <span class="tape" aria-hidden="true"></span>
                <span class="polaroid__photo">
                    @if (album.coverImage?.file?.path) {
                        <img [src]="album.coverImage!.file.path" alt="" loading="lazy">
                    }
                </span>
                <span class="polaroid__caption">
                    <span class="polaroid__title">{{ album.name }}</span>
                    @if (album.description) {
                        <span class="polaroid__desc">{{ album.description }}</span>
                    }
                </span>
            </button>

            @if (edit) {
                <div class="actions">
                    <mat-slide-toggle [(ngModel)]="album.show" (change)="changeVisibility(album)">Show Album</mat-slide-toggle>
                    <mat-icon (click)="deleteAlbum(album.id)" class="delete-icon spc-left">delete_forever</mat-icon>
                </div>
            }
        </li>
    }
</ul>
