<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 items-center gap-8 justify-between justify-items-center w-full max-w-[1200px] mx-auto">
    <div *ngFor="let album of albums">
        <a href="javascript:void(0);" (click)="openImageModal(album.id)" class="polaroid">
            <div class="p-5 w-full">
                <div class="relative w-full aspect-square">
                    <!-- Base image -->
                    <img
                    [src]="album.coverImage?.file?.path"
                    alt="Album Cover"
                    class="w-full h-full object-cover"
                    >

                    <!-- Overlay image -->
                    <!-- <img
                    src="/images/polaroid-image.avif"
                    alt=""
                    class="absolute inset-0 w-full h-full object-cover opacity-30 pointer-events-none"
                    > -->
                    <div class="absolute inset-0 shadow-inner-both pointer-events-none z-10"></div>
                </div>
            </div>
            <div class="flex items-center justify-center h-full p-5 pt-0 bg-cover bg-center bg-no-repeat">
                <h3 class="text-center">{{album.name}}</h3>
                <!--<p *ngIf="album.description">{{album.description}}</p>-->
            </div>
            <div *ngIf="edit" class="actions">
                <mat-slide-toggle [(ngModel)]="album.show" (change)="changeVisibility(album)">Show Album</mat-slide-toggle>
                <mat-icon (click)="deleteAlbum(album.id)" class="delete-icon spc-left">delete_forever</mat-icon>
            </div>
        </a>
    </div>
</div>
