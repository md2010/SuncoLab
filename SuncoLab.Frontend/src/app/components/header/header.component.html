<header class="site-header"
  [class.site-header--compact]="compact"
  [class.site-header--scrolled]="scrolled"
  [class.site-header--hidden]="hidden && !menuOpen">

  <a routerLink="/" class="site-header__logo" aria-label="Hazarder - naslovnica" (click)="closeMenu()">
    <!-- Mala varijanta (deblji potezi) za mobitel i kompaktni header, velika za desktop na vrhu -->
    <img class="site-header__logo-sm" src="/images/Hazarder-logo-small.svg" alt="Hazarder" width="500" height="128">
    <img class="site-header__logo-lg" src="/images/Hazarder-logo.svg" alt="" width="500" height="128">
  </a>

  <nav class="site-header__nav" aria-label="Glavna navigacija">
    <ul>
      @for (link of links; track link.path) {
        <li><a [routerLink]="link.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: link.exact ?? false }">{{ link.label }}</a></li>
      }
      @if (authorized) {
        <li><a routerLink="/admin" routerLinkActive="is-active">Admin</a></li>
        <li><button type="button" (click)="logout()">Log out</button></li>
      }
    </ul>
  </nav>

  <!-- Tanke linije kao potezi u logotipu; pretvaraju se u X -->
  <button type="button" class="site-header__burger"
    [class.is-open]="menuOpen"
    (click)="toggleMenu()"
    [attr.aria-label]="menuOpen ? 'Zatvori izbornik' : 'Otvori izbornik'"
    [attr.aria-expanded]="menuOpen"
    aria-controls="mobile-menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<!-- Mobilni izbornik: papir ispod headera, linkovi ulaze jedan za drugim -->
@if (menuVisible) {
  <div id="mobile-menu" class="mobile-menu" [class.is-open]="menuOpen">
    <nav aria-label="Glavna navigacija">
      <ul class="mobile-menu__list">
        @for (link of links; track link.path; let i = $index) {
          <li [style.--i]="i">
            <a [routerLink]="link.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: link.exact ?? false }">
              {{ link.label }}
              <svg viewBox="0 0 28 28" width="22" height="22" fill="none" aria-hidden="true">
                <path d="M18.5 6.2c0 .8.8 2 1.6 3.1 1.1 1.3 2.3 2.5 3.8 3.4 1.1.7 2.4 1.3 3.5 1.3m0 0c-1.1 0-2.4.6-3.5 1.3-1.5.9-2.7 2.1-3.8 3.4-.8 1-1.6 2.3-1.6 3.1M27.4 14H.6" stroke="currentColor" stroke-width="2"/>
              </svg>
            </a>
          </li>
        }
      </ul>

      @if (authorized) {
        <div class="mobile-menu__admin" [style.--i]="links.length">
          <a routerLink="/admin" routerLinkActive="is-active">Admin</a>
          <button type="button" (click)="logout()">Log out</button>
        </div>
      }
    </nav>
  </div>
}
