<div class="grid spc-top">
    <div class="box" *ngFor="let blog of blogs">
        <a href="javascript:void(0)" (click)="openBlog(blog.id)">
            <img [src]="blog.coverImage?.file?.path" widht="600px" width="700px">
        </a>
        <h3>{{blog.name}}</h3>
        <i>{{blog.author}}</i>
        <p *ngIf="blog.description != null && blog.description != ''">{{blog.description}}</p>
    </div>
</div>
